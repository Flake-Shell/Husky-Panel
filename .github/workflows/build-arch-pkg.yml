# ---------------------------------------------------------------
# GitHub Actions — Build Arch Linux package (.pkg.tar.zst)
# ---------------------------------------------------------------

name: Build Arch Package

on:
  # Build only for release tags (every GitHub Release is backed by a tag,
  # so this covers releases too). Use "Run workflow" for manual builds.
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-arch-pkg:
    name: Arch Linux (.pkg.tar.zst) [${{ matrix.arch }}]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base

    steps:
      - name: Disable pacman sandbox (aarch64 only)
        if: matrix.arch == 'aarch64'
        run: sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf

      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm --needed
          pacman -S --noconfirm --needed base-devel git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # arch/PKGBUILD builds directly from this checkout (no remote source).
      - name: Build package with makepkg
        run: |
          useradd -m builder

          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE/arch' && PKGEXT='.pkg.tar.zst' makepkg --syncdeps --cleanbuild --noconfirm"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: husky-panel-arch-pkg-${{ matrix.arch }}
          path: |
            arch/*.pkg.tar.zst
            arch/*.pkg.tar.xz
            arch/*.pkg.tar.zst.sig
            arch/*.pkg.tar.xz.sig
          if-no-files-found: error
          retention-days: 30
